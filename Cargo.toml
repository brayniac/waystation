[package]
name = "waystation"
version = "0.1.0"
edition = "2024"
description = "Async cross-agent coordination over a git repository, exposed as an MCP server"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
jiff = { version = "0.2", features = ["serde"] }
rmcp = { version = "3.3", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
